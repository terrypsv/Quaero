name: release

# Declenche par un tag de version. Le binaire est autonome: le frontend et les
# donnees embarquees voyagent dedans, il n'y a rien d'autre a distribuer.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: coherence version et tag
        run: |
          echo "Tag: ${GITHUB_REF_NAME}"
          test -n "${GITHUB_REF_NAME}"

      - name: verification
        run: |
          gofmt -l . | tee /tmp/fmt.txt
          test ! -s /tmp/fmt.txt
          go vet ./...
          go test ./... -count=1

      - name: compilation
        env:
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          version="${GITHUB_REF_NAME}"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="quaero-${os}-${arch}"
            if [ "$os" = "windows" ]; then name="$name.exe"; fi
            GOOS="$os" GOARCH="$arch" go build \
              -ldflags "-s -w -X main.version=${version}" \
              -o "dist/$name" ./cmd/quaero
          done
          ls -lh dist

      - name: sommes de controle
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/*
