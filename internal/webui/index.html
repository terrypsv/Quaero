<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quaero</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='28' cy='28' r='19' fill='none' stroke='%23101010' stroke-width='10'/%3E%3Crect x='41' y='41' width='18' height='18' fill='%23C6F432' stroke='%23101010' stroke-width='4'/%3E%3C/svg%3E">
<style>
  /* Direction Index: papier, encre, et un vert acide qui surligne ce que
     Quaero a compris. Une seule chose a l'ecran a la fois: la question, puis
     les depots. Le reste (options, raisons d'un rang) se deplie a la demande.
     Polices embarquees dans le binaire, voir scripts/polices.py. */
  @font-face {
    font-family: "JetBrains Mono"; src: url("/fonts/jetbrains-mono.woff2") format("woff2");
    font-weight: 400 800; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: "Syne"; src: url("/fonts/syne.woff2") format("woff2");
    font-weight: 700 800; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: "Archivo Quaero"; src: url("/fonts/archivo-quaero.woff2") format("woff2");
    font-weight: 800; font-stretch: 125%; font-style: normal; font-display: block;
  }
  :root {
    --papier: #F1F1EE;
    --encre: #101010;
    --gris: #5E5E5A;
    --pale: #8C8C86;
    --trait: #CFCFC9;
    --acide: #C6F432;
    --blanc: #FFFFFF;
    --mono: "JetBrains Mono", Consolas, "SF Mono", Menlo, "DejaVu Sans Mono", monospace;
    --titre: "Syne", "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  html { background: var(--papier); }
  body {
    margin: 0; background: var(--papier); color: var(--encre);
    font: 15px/1.55 var(--mono); -webkit-font-smoothing: antialiased;
    /* JetBrains Mono dessine >= en un seul signe: une requete a recopier doit
       montrer les caracteres qu'elle contient. */
    font-variant-ligatures: none;
  }
  a { color: var(--encre); text-underline-offset: 4px; }
  button, select { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--encre); outline-offset: 2px; }

  .page { max-width: 960px; margin: 0 auto; padding: 24px 20px 64px; display: flex; flex-direction: column; gap: 32px; }

  .tete { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .marque { display: inline-flex; align-items: center; gap: 12px; text-decoration: none; }
  .mot {
    font-family: "Archivo Quaero", var(--titre); font-weight: 800; font-stretch: 125%;
    font-size: 28px; line-height: 1; letter-spacing: -1px;
  }
  .version { color: var(--pale); font-size: 13px; }
  .cache { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .question { display: flex; flex-direction: column; gap: 12px; }
  .barre { display: flex; flex-wrap: wrap; border: 3px solid var(--encre); background: var(--blanc); }
  #q {
    flex: 999 1 300px; min-width: 0; min-height: 64px; padding: 0 18px;
    border: 0; border-radius: 0; background: transparent; color: var(--encre);
    font: 19px var(--mono); font-variant-ligatures: none;
  }
  #q:focus-visible { outline: none; box-shadow: inset 0 -5px 0 var(--acide); }
  #q::placeholder { color: var(--pale); }
  .go {
    flex: 0 0 auto; min-height: 64px; padding: 0 28px; border: 0; border-radius: 0;
    background: var(--encre); color: var(--acide); font-weight: 700; font-size: 16px; cursor: pointer;
  }
  .go:disabled { color: var(--pale); cursor: default; }

  .sous-barre { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 4px 24px; font-size: 13px; }
  .idees { display: flex; flex-wrap: wrap; align-items: center; gap: 0 16px; color: var(--gris); }
  .idee {
    min-height: 36px; padding: 0; border: 0; background: none; cursor: pointer; color: var(--gris); text-align: left;
    text-decoration: underline; text-decoration-color: var(--trait); text-underline-offset: 4px;
  }
  .idee:hover { color: var(--encre); text-decoration-color: var(--encre); }

  details.options { min-width: 0; }
  details.options summary { min-height: 36px; display: flex; align-items: center; cursor: pointer; font-weight: 700; }
  /* Un + ou un - dit qu'il y a quelque chose a deplier, le triangle natif
     disparaissant avec display: flex. */
  details > summary { list-style: none; }
  details > summary::-webkit-details-marker { display: none; }
  details > summary::after { content: "+"; margin-left: 8px; font-weight: 700; }
  details[open] > summary::after { content: "-"; }
  .panneau {
    margin-top: 8px; padding: 14px 16px; background: var(--blanc); border: 2px solid var(--encre);
    display: flex; flex-direction: column; gap: 14px; max-width: 520px;
  }
  .opt { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 4px 12px; align-items: center; }
  .opt .aide { grid-column: 2; color: var(--gris); font-size: 12px; }

  .boutons { display: flex; flex-wrap: wrap; gap: 6px; }
  .choix {
    min-height: 36px; padding: 0 12px; border: 2px solid var(--encre); border-radius: 0;
    background: transparent; font-size: 14px; cursor: pointer;
  }
  .choix:hover { background: var(--blanc); }
  .choix.on { background: var(--encre); color: var(--papier); }
  .choix .n { margin-left: 6px; color: var(--gris); }
  .choix.on .n { color: var(--acide); }

  .lecture { margin: 0; font: 700 clamp(22px, 3.4vw, 30px)/1.3 var(--titre); letter-spacing: -0.01em; overflow-wrap: anywhere; }
  .lecture mark { background: var(--acide); color: var(--encre); padding: 0 0.1em; cursor: help; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  .lecture .vide, .lecture s { color: var(--pale); }
  .requete { margin: 6px 0 0; color: var(--gris); font-size: 13px; overflow-wrap: anywhere; }
  .requete code { font: inherit; }

  .bandeau { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; padding-bottom: 12px; border-bottom: 3px solid var(--encre); }
  .bandeau h2 { margin: 0; font: 800 28px/1.1 var(--titre); }
  .bandeau h2 small { margin-left: 10px; font: 400 13px var(--mono); color: var(--gris); }
  .tri { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--gris); }
  .tri select { min-height: 36px; padding: 0 8px; border: 2px solid var(--encre); border-radius: 0; background: var(--blanc); color: var(--encre); font-size: 14px; }
  .quota { padding: 2px 10px; background: var(--encre); color: var(--acide); font-size: 13px; }
  .filtres { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 12px; }

  .note { margin: 0; padding: 10px 14px; background: var(--acide); font-size: 14px; }
  .erreur { margin: 0; padding: 14px 16px; background: var(--encre); color: var(--papier); }
  .erreur b { color: var(--acide); margin-right: 10px; }
  .attente, .rien { margin: 0; padding: 40px 0; text-align: center; color: var(--gris); }
  .attente::after {
    content: ""; display: block; width: 120px; height: 10px; margin: 16px auto 0;
    border: 2px solid var(--encre); background: linear-gradient(90deg, var(--acide) 50%, transparent 50%);
    background-size: 200% 100%; animation: balaye 0.9s linear infinite;
  }
  @keyframes balaye { from { background-position: 100% 0; } to { background-position: -100% 0; } }

  .liste { list-style: none; margin: 0; padding: 0; }
  .depot { padding: 18px 0; border-bottom: 1px solid var(--trait); display: flex; flex-direction: column; gap: 6px; }
  .l1 { display: flex; align-items: baseline; gap: 12px; }
  .rang { flex: 0 0 auto; color: var(--pale); font-size: 13px; }
  .nom { min-width: 0; font-weight: 700; font-size: 17px; overflow-wrap: anywhere; }
  .sante { margin-left: auto; flex: 0 0 auto; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; cursor: help; }
  .barres { display: inline-flex; gap: 2px; }
  .barres i { width: 8px; height: 8px; border: 1.5px solid var(--encre); }
  .barres i.plein { background: var(--encre); }
  .desc {
    margin: 0; color: var(--gris); overflow-wrap: anywhere;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .meta { display: flex; flex-wrap: wrap; gap: 2px 18px; font-size: 13px; color: var(--gris); }
  .meta b { color: var(--encre); font-weight: 500; }
  details.plus summary { min-height: 32px; display: inline-flex; align-items: center; cursor: pointer; font-size: 13px; color: var(--gris); }
  details.plus summary:hover { color: var(--encre); }
  .plus-corps { display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; background: var(--blanc); border: 1px solid var(--trait); font-size: 13px; }
  .plus-corps p { margin: 0; }
  .affiner { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .sujet { min-height: 30px; padding: 0 8px; border: 1px solid var(--encre); background: none; font-size: 12px; cursor: pointer; }
  .sujet:hover { background: var(--acide); }

  .pagination { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 12px; color: var(--gris); font-size: 13px; }

  footer { color: var(--pale); font-size: 12px; }
  footer p { margin: 0 0 2px; }

  @media (max-width: 600px) {
    .go { flex: 1 1 100%; }
    .l1 { flex-wrap: wrap; }
    .sante { margin-left: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .attente::after { animation: none; }
  }
</style>
</head>
<body>
<div class="page">
  <header class="tete">
    <a class="marque" href="/" aria-label="Quaero, nouvelle recherche">
      <svg aria-hidden="true" width="34" height="34" viewBox="0 0 64 64" fill="none"><circle cx="28" cy="28" r="19" stroke="#101010" stroke-width="10"/><rect x="41" y="41" width="18" height="18" fill="#C6F432" stroke="#101010" stroke-width="4"/></svg>
      <span class="mot">quaero</span>
    </a>
    <span class="version" id="version"></span>
  </header>

  <section class="question" aria-label="Recherche">
    <div class="barre">
      <label for="q" class="cache">Ce que tu cherches</label>
      <input type="text" id="q" autofocus autocomplete="off" spellcheck="false"
             placeholder="une bibliothèque go pour parser du yaml, encore maintenue">
      <button class="go" id="go" type="button">chercher</button>
    </div>
    <div class="sous-barre">
      <div class="idees" id="suggest"></div>
      <details class="options" id="options">
        <summary>options</summary>
        <div class="panneau" id="panneau"></div>
      </details>
    </div>
  </section>

  <div id="readback"></div>
  <section id="out" aria-live="polite"></section>

  <footer>
    <p>Forks et dépôts archivés écartés par défaut. Écris « y compris les forks » pour les garder.</p>
    <p>Quaero - Terry Passave &copy; 2026. Tous droits réservés.</p>
  </footer>
</div>

<script>
"use strict";

// Jeu large, pioche au hasard a chaque chargement et sur demande: montrer
// toujours les memes exemples n'apprend rien apres la premiere fois.
var ALL_EXAMPLES = [
  "une bibliothèque rust pour parser du json, très populaire",
  "un outil go de scan réseau encore maintenu",
  "client python pour elasticsearch, au moins 500 étoiles",
  "framework typescript de tests end to end, récent",
  "outil de chiffrement en ligne de commande",
  "une lib go pour générer des pdf",
  "serveur mqtt léger en rust",
  "bibliothèque python de séries temporelles, maintenue",
  "moteur de recherche plein texte embarqué",
  "un outil de migration de base de données en go",
  "parser de logs en rust, performant",
  "client kubernetes en typescript",
  "un générateur de site statique récent",
  "bibliothèque de graphes en python, populaire",
  "un proxy inverse en go, au moins 1000 étoiles",
  "lib de compression rapide en c",
  "framework web minimaliste en rust",
  "outil de capture réseau en ligne de commande",
  "un client ldap en go",
  "bibliothèque de crypto post-quantique",
  "un outil de fuzzing récent",
  "client s3 alternatif en go, maintenu",
  "bibliothèque de parsing yaml en rust",
  "outil de gestion de secrets en ligne de commande",
  "lib de validation de schéma json en python",
  "un émulateur de terminal en rust"
];

// Les libelles disent ce que le niveau veut dire pour qui choisit une
// dependance, pas comment il s'appelle dans le code.
var HEALTH_LABEL = { sain: "actif", calme: "stable", dormant: "ralenti", abandonne: "arrêté", archive: "archivé" };

// Barres pleines par niveau, de quatre pour un projet actif a zero pour un
// projet archive. La forme se lit sans la couleur.
var HEALTH_BARS = { sain: 4, calme: 3, dormant: 2, abandonne: 1, archive: 0 };

var HEALTH_HINT = {
  sain:      "Du code a été poussé il y a moins de 3 mois, le projet vit aujourd'hui",
  calme:     "Dernier changement il y a moins d'un an, normal pour une bibliothèque terminée",
  dormant:   "Entre 1 et 2 ans sans changement, personne ne s'en occupe activement",
  abandonne: "Plus de 2 ans sans changement, aucun correctif ne viendra",
  archive:   "Fermé par son auteur, en lecture seule"
};

var SORTS = [
  ["pertinence", "au plus proche"],
  ["populaire",  "les plus adoptés"],
  ["niche",      "les plus ciblés"],
  ["recent",     "modifiés récemment"],
  ["sante",      "les plus fiables"]
];

var SCOPES = [
  ["anglais", "anglais", "Une requête, termes traduits en anglais."],
  ["elargi",  "toutes langues", "Cherche aussi en chinois, japonais, russe, espagnol et portugais. Coûte 5 requêtes."]
];

var PRECISIONS = [
  ["approfondie", "approfondie", "Pose la question de cinq façons, les dépôts trouvés par plusieurs remontent. Coûte 5 requêtes."],
  ["rapide", "rapide", "Une seule requête, plus rapide, moins précise."]
];

var SCRIPT_LABEL = {
  latin: "latin", chinois: "chinois", japonais: "japonais", coreen: "coréen",
  cyrillique: "cyrillique", arabe: "arabe", hebreu: "hébreu", grec: "grec",
  devanagari: "devanagari", thai: "thaï", indetermine: "sans description"
};

// Ce que chaque role de la lecture mot a mot (model.Segment) a envoye dans la
// requete. Seuls ces roles sont surlignes.
function qualifier(s, query) {
  var m;
  switch (s.role) {
    case "terme":    return s.value;
    case "langage":  return "language:" + s.value;
    case "etoiles":  return "stars:>=" + s.value;
    case "recence":  m = /pushed:>=(\S+)/.exec(query || ""); return m ? "pushed:>=" + m[1] : "récent";
    case "forks":    return "forks gardés";
    case "archives": return "archivés gardés";
  }
  return "";
}

var state = {
  sort: "pertinence", page: 1, filter: "tous", script: "tous",
  scope: "anglais", precision: "approfondie", data: null
};

function $(id) { return document.getElementById(id); }

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function fmt(n) { return (n || 0).toLocaleString("fr-FR"); }
function pad(n) { return n < 10 ? "0" + n : String(n); }

function age(days) {
  if (days == null || days < 0) return "";
  if (days === 0) return "envoi aujourd'hui";
  if (days === 1) return "envoi hier";
  if (days < 60) return "envoi il y a " + days + " j";
  if (days < 730) return "envoi il y a " + Math.round(days / 30) + " mois";
  return "envoi il y a " + Math.round(days / 365) + " ans";
}

function pick(arr, n) {
  var copy = arr.slice(), i, j, tmp;
  for (i = copy.length - 1; i > 0; i--) {
    j = Math.floor(Math.random() * (i + 1));
    tmp = copy[i]; copy[i] = copy[j]; copy[j] = tmp;
  }
  return copy.slice(0, n);
}

function renderSuggestions() {
  var box = $("suggest");
  box.innerHTML = "";
  var lab = document.createElement("span");
  lab.textContent = "exemples";
  box.appendChild(lab);
  pick(ALL_EXAMPLES, 3).forEach(function (text) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "idee";
    b.textContent = text;
    b.onclick = function () { $("q").value = text; run({ page: 1 }); };
    box.appendChild(b);
  });
  var r = document.createElement("button");
  r.type = "button";
  r.className = "idee";
  r.textContent = "d'autres";
  r.onclick = renderSuggestions;
  box.appendChild(r);
}

// Les options touchent la requete elle-meme: elles restent pres de la barre de
// recherche, repliees tant qu'on n'en a pas besoin.
function renderOptions() {
  var h = opt("langues", "data-scope", SCOPES, state.scope)
        + opt("précision", "data-precision", PRECISIONS, state.precision);
  $("panneau").innerHTML = h;
  bind("#panneau [data-scope]", function (b) { setOption({ scope: b.getAttribute("data-scope") }); });
  bind("#panneau [data-precision]", function (b) { setOption({ precision: b.getAttribute("data-precision") }); });
}

function opt(label, attr, table, current) {
  var h = '<div class="opt"><span>' + esc(label) + '</span><div class="boutons">';
  var hint = "";
  table.forEach(function (o) {
    if (o[0] === current) hint = o[2];
    h += btn(attr, o[0], o[1], o[0] === current, null);
  });
  return h + '</div><span class="aide">' + esc(hint) + "</span></div>";
}

function setOption(o) {
  if (o.scope) state.scope = o.scope;
  if (o.precision) state.precision = o.precision;
  renderOptions();
  if ($("q").value.trim()) run({ page: 1 });
}

function init() {
  renderSuggestions();
  renderOptions();
  $("go").onclick = function () { run({ page: 1 }); };
  $("q").addEventListener("keydown", function (e) {
    if (e.key === "Enter") run({ page: 1 });
  });
  fetch("/api/version").then(function (r) { return r.json(); })
    .then(function (d) { $("version").textContent = d.version || ""; })
    .catch(function () {});
}

// Ajouter un langage ou un sujet a la phrase et relancer: c'est le raffinement
// qu'on veut faire neuf fois sur dix apres une premiere page.
function refineWith(word) {
  var current = $("q").value.trim();
  if (current.toLowerCase().indexOf(word.toLowerCase()) >= 0) return;
  $("q").value = current + " " + word;
  run({ page: 1 });
}

function run(opts) {
  opts = opts || {};
  var phrase = $("q").value.trim();
  if (!phrase) return;

  if (opts.page) state.page = opts.page;
  if (opts.sort) { state.sort = opts.sort; state.page = 1; }

  $("go").disabled = true;
  $("out").innerHTML = '<p class="attente">recherche en cours</p>';

  var url = "/api/search?q=" + encodeURIComponent(phrase)
          + "&sort=" + encodeURIComponent(state.sort)
          + "&scope=" + encodeURIComponent(state.scope)
          + "&precision=" + encodeURIComponent(state.precision)
          + "&page=" + state.page;

  fetch(url)
    .then(function (r) { return r.json(); })
    .then(function (data) {
      renderReadback(data);
      if (data.error) {
        $("out").innerHTML = '<p class="erreur"><b>erreur</b>' + esc(data.error) + "</p>";
        return;
      }
      state.data = data;
      state.filter = "tous";
      state.script = "tous";
      render();
    })
    .catch(function (err) {
      $("out").innerHTML = '<p class="erreur"><b>erreur réseau</b>' + esc(String(err)) + "</p>";
    })
    .then(function () { $("go").disabled = false; });
}

// La phrase revient telle qu'elle a ete tapee, mots compris surlignes. Survoler
// un mot surligne montre ce qu'il est devenu dans la requete.
function renderReadback(data) {
  var it = data.intent || {};
  var query = data.query || "";
  var head = "";
  (it.reading || []).forEach(function (s) {
    var t = esc(s.text);
    var q = qualifier(s, query);
    if (q) { head += '<mark title="' + esc(q) + '">' + t + "</mark>"; return; }
    if (s.role === "generique" || s.role === "limite") { head += "<s>" + t + "</s>"; return; }
    if (s.role === "vide") { head += '<span class="vide">' + t + "</span>"; return; }
    head += t;
  });
  var h = "";
  if (head) h += '<p class="lecture" aria-label="Phrase lue">' + head + "</p>";
  if (query) h += '<p class="requete">requête envoyée <code>' + esc(query) + "</code></p>";
  $("readback").innerHTML = h;
}

function render() {
  var data = state.data;
  if (!data) return;
  var repos = data.repos || [];

  if (!repos.length) {
    $("out").innerHTML = '<p class="rien">Aucun dépôt sur cette page. Essaie des termes plus larges.</p>';
    return;
  }

  var counts = { tous: repos.length, sain: 0, calme: 0, dormant: 0, abandonne: 0, archive: 0 };
  var scripts = {};
  repos.forEach(function (r) {
    var l = (r.health || {}).level;
    if (counts[l] !== undefined) counts[l]++;
    var sc = r.script || "indetermine";
    scripts[sc] = (scripts[sc] || 0) + 1;
  });

  var total = data.total || 0;
  var h = '<div class="bandeau"><h2>' + fmt(total) + (total > 1 ? " dépôts" : " dépôt")
        + "<small>" + repos.length + " affichés</small></h2>";
  var quota = data.quota || {};
  if (quota.limit > 0 && quota.remaining < 200) {
    // Un quota sur le point de manquer change ce qu'on fait ensuite. Tant
    // qu'il ne manque pas, il n'a rien a faire a l'ecran.
    h += '<span class="quota" title="Quota de l\'API GitHub'
       + (quota.reset_at ? ", réinitialisé à " + esc(quota.reset_at) : "") + '">quota '
       + fmt(quota.remaining) + "/" + fmt(quota.limit) + "</span>";
  }
  h += '<label class="tri">trier <select id="tri">';
  SORTS.forEach(function (s) {
    h += '<option value="' + s[0] + '"' + (state.sort === s[0] ? " selected" : "") + ">" + esc(s[1]) + "</option>";
  });
  h += "</select></label></div>";

  h += '<div class="filtres"><div class="boutons" role="group" aria-label="Filtrer par activité">';
  ["tous", "sain", "calme", "dormant", "abandonne", "archive"].forEach(function (level) {
    if (level !== "tous" && counts[level] === 0) return;
    h += btn("data-filter", level, level === "tous" ? "tous" : HEALTH_LABEL[level],
      state.filter === level, counts[level]);
  });
  h += "</div>";
  var scriptKeys = Object.keys(scripts);
  if (scriptKeys.length > 1) {
    h += '<div class="boutons" role="group" aria-label="Filtrer par écriture">'
       + btn("data-script", "tous", "toutes écritures", state.script === "tous", null);
    scriptKeys.sort(function (a, b) { return scripts[b] - scripts[a]; }).forEach(function (sc) {
      h += btn("data-script", sc, SCRIPT_LABEL[sc] || sc, state.script === sc, scripts[sc]);
    });
    h += "</div>";
  }
  h += "</div>";

  if (data.note) h += '<p class="note">' + esc(data.note) + "</p>";

  var offset = ((data.page || 1) - 1) * 50;
  h += '<ol class="liste">';
  repos.forEach(function (r, i) {
    var okHealth = state.filter === "tous" || (r.health || {}).level === state.filter;
    var okScript = state.script === "tous" || (r.script || "indetermine") === state.script;
    // Le rang reste celui du classement, meme quand un filtre masque des depots.
    if (okHealth && okScript) h += card(r, offset + i + 1);
  });
  h += "</ol>";

  h += pager(data);
  $("out").innerHTML = h;

  $("tri").onchange = function () { run({ sort: this.value }); };
  bind("#out [data-filter]", function (b) { state.filter = b.getAttribute("data-filter"); render(); });
  bind("#out [data-script]", function (b) { state.script = b.getAttribute("data-script"); render(); });
  bind("#out [data-page]", function (b) { run({ page: parseInt(b.getAttribute("data-page"), 10) }); });
  bind("#out [data-refine]", function (b) { refineWith(b.getAttribute("data-refine")); });
}

function btn(attr, value, label, active, count) {
  var h = '<button type="button" class="choix' + (active ? " on" : "") + '" '
        + attr + '="' + esc(value) + '" aria-pressed="' + (active ? "true" : "false") + '">' + esc(label);
  if (count !== null && count !== undefined) h += '<span class="n">' + count + "</span>";
  return h + "</button>";
}

function bind(selector, fn) {
  var nodes = document.querySelectorAll(selector), i;
  for (i = 0; i < nodes.length; i++) {
    (function (node) { node.onclick = function () { fn(node); }; })(nodes[i]);
  }
}

function pager(data) {
  var pages = data.pages || 1;
  var cur = data.page || 1;
  if (pages <= 1) return "";
  var h = '<nav class="pagination" aria-label="Pages">';
  if (cur > 1) h += '<button type="button" class="choix" data-page="' + (cur - 1) + '">précédent</button>';
  h += "<span>page " + cur + " sur " + pages + "</span>";
  if (cur < pages) h += '<button type="button" class="choix" data-page="' + (cur + 1) + '">suivant</button>';
  return h + "</nav>";
}

function bars(level) {
  var full = HEALTH_BARS[level] || 0, h = '<span class="barres" aria-hidden="true">', i;
  for (i = 0; i < 4; i++) h += i < full ? '<i class="plein"></i>' : "<i></i>";
  return h + "</span>";
}

function card(r, position) {
  var health = r.health || {};
  var level = health.level || "";
  var h = '<li class="depot"><div class="l1"><span class="rang">' + pad(position) + "</span>"
        + '<a class="nom" href="' + esc(r.url) + '" target="_blank" rel="noopener">' + esc(r.full_name) + "</a>";
  if (level) {
    h += '<span class="sante" title="' + esc(HEALTH_HINT[level] || "") + '">'
       + bars(level) + esc(HEALTH_LABEL[level] || level) + "</span>";
  }
  h += "</div>";

  if (r.description) h += '<p class="desc">' + esc(r.description) + "</p>";

  h += '<div class="meta"><span><b>' + fmt(r.stars) + "</b> étoiles</span>";
  if (r.language) h += "<span>" + esc(r.language) + "</span>";
  if (r.license) h += "<span>" + esc(r.license) + "</span>";
  var when = age(health.days_since_push);
  if (when) h += "<span>" + esc(when) + "</span>";
  if (r.script && r.script !== "latin" && r.script !== "indetermine") {
    h += "<span>description en " + esc(SCRIPT_LABEL[r.script] || r.script) + "</span>";
  }
  h += "</div>";

  // Les raisons du rang et du verdict restent a portee, sans encombrer la
  // liste: on les deplie quand un resultat surprend.
  var details = "";
  if (r.why && r.why.length) details += "<p>" + esc(r.why.join(", ")) + ".</p>";
  if (health.notes && health.notes.length) details += "<p>" + esc(health.notes.join(". ")) + ".</p>";
  var refine = [];
  if (r.language) refine.push(r.language);
  (r.topics || []).slice(0, 8).forEach(function (t) { refine.push(t); });
  if (refine.length) {
    details += '<div class="affiner"><span>affiner avec</span>';
    refine.forEach(function (w) {
      details += '<button type="button" class="sujet" data-refine="' + esc(w) + '">' + esc(w) + "</button>";
    });
    details += "</div>";
  }
  if (details) {
    h += '<details class="plus"><summary>pourquoi ce rang</summary><div class="plus-corps">' + details + "</div></details>";
  }
  return h + "</li>";
}

init();
</script>
</body>
</html>
